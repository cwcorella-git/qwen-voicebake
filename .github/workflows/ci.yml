name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0
      - name: Install
        run: python -m pip install -e ".[dev,app,test-app,loudness]"
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Tones doc is current
        run: python scripts/gen_tones_md.py --check
      - name: Build
        run: python -m pip install build && python -m build
