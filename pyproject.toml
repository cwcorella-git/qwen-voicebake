[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "qwen-voicebake"
dynamic = ["version"]
description = "Bake game dialogue into audio files with Qwen3-TTS."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["tts", "text-to-speech", "qwen3-tts", "voice-cloning", "game-dev", "godot", "dialogue"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
authors = [{ name = "cwcorella-git" }]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "soundfile",
    "tomli; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/cwcorella-git/qwen-voicebake"
Repository = "https://github.com/cwcorella-git/qwen-voicebake"
Issues = "https://github.com/cwcorella-git/qwen-voicebake/issues"

[project.optional-dependencies]
tts = ["qwen-tts", "torch"]
app = ["PySide6>=6.6"]
loudness = ["pyloudnorm"]
all = ["qwen-tts", "torch", "PySide6>=6.6", "pyloudnorm"]
dev = ["pytest", "ruff", "pillow"]  # pillow: optional, shrinks docs screenshots
test-app = ["pytest-qt"]

[project.scripts]
voicebake = "qwen_voicebake.cli:main"
voicebake-app = "qwen_voicebake.app.main:main"

[tool.hatch.version]
path = "src/qwen_voicebake/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/qwen_voicebake"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
